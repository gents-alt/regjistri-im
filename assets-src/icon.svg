<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13233B"/>
      <stop offset="1" stop-color="#07101E"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#3BBFB3"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background; rounded for "any", Android masks it for "maskable" -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- content kept within central 80% safe zone (~52..460) -->
  <g transform="translate(106 96)">
    <!-- calendar body -->
    <rect x="0" y="24" width="300" height="276" rx="34" fill="#0D1828" stroke="url(#ring)" stroke-width="14"/>
    <!-- header bar -->
    <path d="M0 58 a34 34 0 0 1 34-34 h232 a34 34 0 0 1 34 34 v26 H0 Z" fill="#818CF8"/>
    <!-- hangers -->
    <rect x="64" y="0" width="20" height="56" rx="10" fill="#C7CEFB"/>
    <rect x="216" y="0" width="20" height="56" rx="10" fill="#C7CEFB"/>
    <!-- pulse / heartbeat line -->
    <path d="M28 196 H92 l24 -58 38 120 30 -78 18 34 h84"
          fill="none" stroke="#34D399" stroke-width="18"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- euro mark -->
    <g transform="translate(150 232)">
      <path d="M44 -20 a34 34 0 1 0 0 56" fill="none" stroke="#FBBF24" stroke-width="14" stroke-linecap="round"/>
      <line x1="4" y1="-2" x2="40" y2="-2" stroke="#FBBF24" stroke-width="14" stroke-linecap="round"/>
      <line x1="4" y1="16" x2="34" y2="16" stroke="#FBBF24" stroke-width="14" stroke-linecap="round"/>
    </g>
  </g>
</svg>
